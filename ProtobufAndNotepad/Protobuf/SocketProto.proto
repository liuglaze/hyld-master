// 唯一权威 proto 源：客户端与服务端运行时 `SocketProto.cs` 必须从本文件生成。
// 生成命令见同目录 `build.bat`。修改协议字段时只改这一份，不要并行修改其他 `SocketProto.proto` 副本。
syntax="proto3";
package SocketProto;

enum RequestCode
{
    RequestNone=0;
    User=1;
    Room=2;
    Friend=3;
    FriendRoom=4;
    PingPong=5;
    Matching=6;
    Battle=7;
    ClearSence=8;
}

enum ActionCode
{
    ActionNone=0;
    Logon=1;
    Login=2;
    CreateRoom=3;
    FindRoom=4;
    PlayerList=5;
    JoinRoom=6;
    Exit=7;
    Chat=8;
    AplyAddFriend=9;
    InviteFriend=10;
    FindName=11;
    UpdateName=12;
    AcceptAddFriend=13;
    RejectAddFriend=14;
    FindPlayerInfo=15;
    FindFriendsInfo=16;
    FriendLogin=17;
    FriendLogout=18;
    AcceptInvateFriend=19;
    RejectInvateFriend=20;
    CancalInvateFriend=21;
    ExitRoom=22;
    GetFriendRoomInfo=23;
    Ping=24;
    Pong=25;
    ChangeHero=26;
    UpDateActiveFriendInfo=27;
    AddMatchingPlayer=28;
    RemoveMatchingPlayer=29;
    StartEnterBattle=30;
    BattleReady=31;
    BattleStart=32;
    BattlePushDowmAllFrameOpeartions=33;
    BattlePushDowmPlayerOpeartions=34;
    ClientSendClearSenceReady=35;
    AllClearSenceReady=36;
    ClientSendGameOver=37;
    BattlePushDowmGameOver=38;
    BattleReview=39;
    BattlePushDownHitEvents=40;
}

enum ReturnCode
{
    ReturnNone=0;
    Succeed=1;
    Fail=2;
    NotRoom=3;
    AddFriend=4;
}

enum RoomState
{
    RoomNormal=0;
    RoomFull=1;
    RoomGame=2;
}

enum PlayerState
{
    PlayerOnline=0;
    PlayerOutline=1;
    PlayerGame=2;
    PlayerOnRoom=3;
    PlayerOnInvated=4;
}

enum Hero
{
    XueLi=0;
    KeErTe=1;
    PeiPei=2;
    PanNi=3;
    BaLi=4;
    GongNiu=5;
    DaLiEr=6;
    GeEr=7;
    BuLuoKe=8;
    BaoPoMaiKe=9;
    ABo=10;
    DiKe=11;
    BeiYa=12;
    TaLa=13;
    MaiKeSi=14;
    SiPaiKe=15;
    HeiYa=16;
    LiAng=17;
    PaMu=18;
    RuiKe=19;
}



enum FightPattern
{
    BaoShiZhengBa=0;
    Sheji=1;
}

enum MoveType
{
    NewMove=0;
    OldMove=1;
}

enum AttackType
{
    Normal=0;
    Super=1;
}

message MainPack
{
    RequestCode requestcode=1;
    ActionCode actioncode=2;
    ReturnCode returncode=3;
    LoginPack loginpack=4;
    string str=5;
    repeated RoomPack roompack=6;
    repeated PlayerPack friendspack=7;
    PlayerPack userInfopack=8;
    repeated FriendRoomPack friendroompack=9;
    repeated PlayerPack playerspack=10;
    ChatPack chatpack=11;
    repeated BattlePlayerPack battleplayerpack=12;
    BattleInfo battleInfo=13;
    int64 timestamp=14;
}

message ChatPack
{
    string playername=1;
    string message=2;
    int32 state=3;
}

message LoginPack
{
    string username=1;
    string password=2;
}

message RoomPack
{
    string roomid=1;
    int32 maxnum=2;
    int32 curnum=3;
    RoomState state=4;
}

message BattlePlayerPack
{
    int32 id=1;
    int32 teamid=2;
    int32 roomid=3;
    string playername=4;
    Hero hero=5;
    int32 battleid=6;
}

message BattleRoomPack
{
    string roomid=1;
    int32 maxnum=2;
    int32 curnum=3;
    FightPattern fightpattern=4;
    repeated BattlePlayerPack battleplayerpack=5;
}

message FriendRoomPack
{
    string roomid=1;
    int32 maxnum=2;
    int32 curnum=3;
    RoomState state=4;
}

message PlayerPack
{
    string username=1;
    string playername=2;
    int32 id=3;
    PlayerState state=4;
    Hero hero=5;
    FightPattern fightpattern=6;
}

message BattleInfo
{
    int32 server_frame=1;
    int32 rand_seed=2;
    repeated BattlePlayerPack battle_users=3;
    BattleClientInput client_input=10;
    BattleServerUpdate server_update=20;
}

message BattleClientInput
{
    int32 battle_player_id=1;
    int32 client_tick=2;
    int32 acked_server_frame=3;
    int32 rtt_ms=4;
    repeated ClientMove moves=10;
    repeated ClientAttack attacks=11;
}

message BattleServerUpdate
{
    repeated BattleFrame frames=1;
    MoveAckResult move_ack=2;
    repeated HitEvent hit_events=3;
    int32 state_base_frame=4;
    repeated AttackAck attack_acks=5;
}

message BattleFrame
{
    int32 server_frame=1;
    repeated PlayerFrameInput player_inputs=2;
    repeated AuthoritativePlayerState player_states=3;
}

message PlayerFrameInput
{
    int32 battle_player_id=1;
    float move_x=2;
    float move_y=3;
    repeated ServerAttack attacks=4;
}

message ClientAttack
{
    int32 attack_id=1;
    int32 attack_move_frame=2;
    float toward_x=3;
    float toward_y=4;
    AttackType attack_type=5;
}

message ServerAttack
{
    int32 attack_id=1;
    int32 attacker_battle_player_id=2;
    int32 attack_move_frame=3;
    int32 spawn_server_frame=4;
    float toward_x=5;
    float toward_y=6;
    float spawn_pos_x=7;
    float spawn_pos_y=8;
    float spawn_pos_z=9;
    AttackType attack_type=10;
}

message ClientMove
{
    int32 move_frame=1;
    float move_x=2;
    float move_y=3;
    float predicted_pos_x=4;
    float predicted_pos_y=5;
    float predicted_pos_z=6;
    MoveType move_type=7;
}

message MoveAckResult
{
    int32 battle_id=1;
    int32 acked_move_frame=2;
    bool ack_good_move=3;
    float correct_pos_x=4;
    float correct_pos_y=5;
    float correct_pos_z=6;
    int32 frame_discrepancy=7;
    bool resolving_frame_discrepancy=8;
}

message HitEvent
{
    int32 attack_id=1;
    int32 attacker_battle_id=2;
    int32 victim_battle_id=3;
    int32 damage=4;
    int32 hit_frame_id=5;
    float hit_pos_x=6;
    float hit_pos_y=7;
    float hit_pos_z=8;
    bool is_kill=9;
}

message AttackAck
{
    int32 battle_player_id=1;
    int32 attack_id=2;
    bool accepted=3;
    int32 mana_after=4;
    string reject_reason=5;
    int32 super_energy_after=6;
}

message AuthoritativePlayerState
{
    int32 battle_id=1;
    float pos_x=2;
    float pos_y=3;
    float pos_z=4;
    int32 hp=5;
    bool is_dead=6;
    uint32 state_mask=7;
    int32 mana=8;
    int32 super_energy=9;
}
