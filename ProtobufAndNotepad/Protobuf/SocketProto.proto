// 唯一权威 proto 源：客户端与服务端运行时 `SocketProto.cs` 必须从本文件生成。
// 生成命令见同目录 `build.bat`。修改协议字段时只改这一份，不要并行修改其他 `SocketProto.proto` 副本。
syntax="proto3";
package SocketProto;

enum RequestCode
{
    // E1 旧战斗链退役：号码与名字保留占位，不可重用。
    reserved 7, 8;
    reserved "Battle", "ClearSence";

    RequestNone=0;
    User=1;
    Room=2;
    Friend=3;
    FriendRoom=4;
    PingPong=5;
    Matching=6;
}

enum ActionCode
{
    // E1 旧战斗链退役：31..41 为已删除的旧战斗/清场/回放/NetSim 动作，
    // 号码与名字保留占位，不可重用（30 = StartEnterBattle 为大厅匹配所需，保留）。
    reserved 31 to 41;
    reserved "BattleReady", "BattleStart", "BattlePushDowmAllFrameOpeartions",
        "BattlePushDowmPlayerOpeartions", "ClientSendClearSenceReady", "AllClearSenceReady",
        "ClientSendGameOver", "BattlePushDowmGameOver", "BattleReview",
        "BattlePushDownHitEvents", "BattleSetNetSimConfig";

    ActionNone=0;
    Logon=1;
    Login=2;
    CreateRoom=3;
    FindRoom=4;
    PlayerList=5;
    JoinRoom=6;
    Exit=7;
    Chat=8;
    AplyAddFriend=9;
    InviteFriend=10;
    FindName=11;
    UpdateName=12;
    AcceptAddFriend=13;
    RejectAddFriend=14;
    FindPlayerInfo=15;
    FindFriendsInfo=16;
    FriendLogin=17;
    FriendLogout=18;
    AcceptInvateFriend=19;
    RejectInvateFriend=20;
    CancalInvateFriend=21;
    ExitRoom=22;
    GetFriendRoomInfo=23;
    Ping=24;
    Pong=25;
    ChangeHero=26;
    UpDateActiveFriendInfo=27;
    AddMatchingPlayer=28;
    RemoveMatchingPlayer=29;
    StartEnterBattle=30;
}

enum ReturnCode
{
    ReturnNone=0;
    Succeed=1;
    Fail=2;
    NotRoom=3;
    AddFriend=4;
}

enum RoomState
{
    RoomNormal=0;
    RoomFull=1;
    RoomGame=2;
}

enum PlayerState
{
    PlayerOnline=0;
    PlayerOutline=1;
    PlayerGame=2;
    PlayerOnRoom=3;
    PlayerOnInvated=4;
}

enum Hero
{
    XueLi=0;
    KeErTe=1;
    PeiPei=2;
    PanNi=3;
    BaLi=4;
    GongNiu=5;
    DaLiEr=6;
    GeEr=7;
    BuLuoKe=8;
    BaoPoMaiKe=9;
    ABo=10;
    DiKe=11;
    BeiYa=12;
    TaLa=13;
    MaiKeSi=14;
    SiPaiKe=15;
    HeiYa=16;
    LiAng=17;
    PaMu=18;
    RuiKe=19;
}



enum FightPattern
{
    BaoShiZhengBa=0;
    Sheji=1;
}

message MainPack
{
    // E1 旧战斗链退役：13 = battleInfo、15 = battle_net_sim_config，号码与名字保留占位。
    reserved 13, 15;
    reserved "battleInfo", "battle_net_sim_config";

    RequestCode requestcode=1;
    ActionCode actioncode=2;
    ReturnCode returncode=3;
    LoginPack loginpack=4;
    string str=5;
    repeated RoomPack roompack=6;
    repeated PlayerPack friendspack=7;
    PlayerPack userInfopack=8;
    repeated FriendRoomPack friendroompack=9;
    repeated PlayerPack playerspack=10;
    ChatPack chatpack=11;
    repeated BattlePlayerPack battleplayerpack=12;
    int64 timestamp=14;
    // 请求关联 ID（计划 P1 / B3）。
    // 0 表示非请求（服务端主动推送、广播、多播）；非 0 时回包会原样带回，
    // 供客户端做「回包匹配 + 超时重试去重」。这是 proto3 追加字段，旧端不受影响。
    int32 request_id=16;
}

message ChatPack
{
    string playername=1;
    string message=2;
    int32 state=3;
}

message LoginPack
{
    string username=1;
    string password=2;
}

message RoomPack
{
    string roomid=1;
    int32 maxnum=2;
    int32 curnum=3;
    RoomState state=4;
}

message BattlePlayerPack
{
    int32 id=1;
    int32 teamid=2;
    int32 roomid=3;
    string playername=4;
    Hero hero=5;
    int32 battleid=6;
}

message FriendRoomPack
{
    string roomid=1;
    int32 maxnum=2;
    int32 curnum=3;
    RoomState state=4;
}

message PlayerPack
{
    string username=1;
    string playername=2;
    int32 id=3;
    PlayerState state=4;
    Hero hero=5;
    FightPattern fightpattern=6;
}

